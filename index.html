<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="가계부">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>가계부</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a}
    .app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column;position:relative}
    .header{padding:16px 20px 12px;background:#fff;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:10}
    .header-top{display:flex;justify-content:space-between;align-items:center}
    .header h1{font-size:20px;font-weight:600}
    .header-date{font-size:13px;color:#888}
    .month-nav{display:flex;align-items:center;gap:10px;margin-top:10px}
    .month-nav button{background:none;border:1px solid #e0e0e0;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;color:#333;display:flex;align-items:center;justify-content:center}
    .month-label{font-size:15px;font-weight:600;flex:1;text-align:center}
    .content{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px}
    .nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #f0f0f0;display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:10}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;background:none;border:none;cursor:pointer;font-size:10px;color:#aaa;transition:color .15s}
    .nav-item.active{color:#1a1a1a}
    .nav-icon{font-size:22px;line-height:1}
    .section{display:none}.section.active{display:block}
    .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    .metric{background:#f8f8f8;border-radius:12px;padding:12px}
    .metric-label{font-size:11px;color:#888;margin-bottom:4px}
    .metric-value{font-size:18px;font-weight:600}
    .metric-value.income{color:#0F6E56}
    .metric-value.expense{color:#c0392b}
    .card{background:#fff;border:1px solid #f0f0f0;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .card-title{font-size:13px;font-weight:600;color:#888;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
    .type-toggle{display:flex;gap:6px;margin-bottom:14px;background:#f5f5f5;border-radius:12px;padding:4px}
    .type-btn{flex:1;padding:9px;border:none;border-radius:9px;font-size:15px;font-weight:500;cursor:pointer;background:none;color:#999;transition:all .2s}
    .type-btn.active.expense{background:#fff;color:#c0392b;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .type-btn.active.income{background:#fff;color:#0F6E56;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .form-group{margin-bottom:12px}
    .form-group label{font-size:13px;color:#888;display:block;margin-bottom:5px}
    input,select{width:100%;padding:12px 14px;border:1px solid #e8e8e8;border-radius:10px;background:#fafafa;color:#1a1a1a;font-size:16px;appearance:none;-webkit-appearance:none}
    input:focus,select:focus{outline:none;border-color:#999;background:#fff}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .submit-btn{width:100%;padding:14px;background:#1a1a1a;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity .15s}
    .submit-btn:active{opacity:.8}
    .tx-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f5f5f5}
    .tx-item:last-child{border-bottom:none}
    .tx-cat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .tx-info{flex:1;min-width:0}
    .tx-desc{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tx-meta{font-size:12px;color:#999;margin-top:2px}
    .tx-amount{font-size:15px;font-weight:600;flex-shrink:0}
    .tx-amount.income{color:#0F6E56}
    .tx-amount.expense{color:#c0392b}
    .tx-del{background:none;border:none;color:#ccc;font-size:20px;padding:4px 8px;cursor:pointer;flex-shrink:0}
    .filter-row{display:flex;gap:8px;margin-bottom:12px}
    .filter-row select{flex:1;padding:9px 12px;font-size:14px}
    .chart-wrap{margin:8px 0}
    .chart-bars{display:flex;align-items:flex-end;gap:6px;height:120px}
    .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
    .bar-wrap{width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100px}
    .bar-income{width:42%;background:#1D9E75;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
    .bar-expense{width:42%;background:#e74c3c;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
    .bar-label{font-size:10px;color:#aaa}
    .legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:#888}
    .legend span{display:flex;align-items:center;gap:5px}
    .legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
    .cat-stats{display:flex;flex-direction:column;gap:10px}
    .cat-stat-item{display:flex;align-items:center;gap:12px}
    .cat-stat-icon{font-size:20px;width:36px;text-align:center}
    .cat-stat-info{flex:1}
    .cat-stat-name{font-size:14px;font-weight:500}
    .cat-stat-bar-wrap{height:4px;background:#f0f0f0;border-radius:2px;margin-top:4px}
    .cat-stat-bar{height:100%;border-radius:2px;background:#e74c3c}
    .cat-stat-right{text-align:right}
    .cat-stat-amt{font-size:14px;font-weight:600}
    .cat-stat-pct{font-size:11px;color:#aaa}
    .budget-item{padding:12px 0;border-bottom:1px solid #f5f5f5}
    .budget-item:last-child{border-bottom:none}
    .budget-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .budget-cat{font-size:14px;font-weight:500}
    .budget-nums{font-size:12px;color:#888}
    .budget-bar-wrap{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}
    .budget-bar{height:100%;border-radius:3px;transition:width .3s}
    .budget-bar.ok{background:#1D9E75}
    .budget-bar.warn{background:#f39c12}
    .budget-bar.over{background:#e74c3c}
    .budget-pct{font-size:11px;margin-top:4px;text-align:right}
    .budget-edit-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .budget-edit-row label{font-size:14px;flex:1}
    .budget-edit-row input{width:130px;flex:none;padding:9px 12px;font-size:14px}
    .alert-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;margin-left:6px;font-weight:600}
    .alert-badge.over{background:#fde8e8;color:#c0392b}
    .alert-badge.warn{background:#fef3e2;color:#d68910}
    .empty{text-align:center;padding:2.5rem 1rem;color:#bbb;font-size:14px}
    .empty-icon{font-size:40px;display:block;margin-bottom:8px}
    .save-btn{width:100%;padding:14px;background:#1a1a1a;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <h1>가계부</h1>
      <span class="header-date" id="today-label"></span>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="month-label"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="content">
    <!-- 홈 -->
    <div id="tab-home" class="section active">
      <div class="summary-grid">
        <div class="metric"><div class="metric-label">수입</div><div class="metric-value income" id="total-income">₩0</div></div>
        <div class="metric"><div class="metric-label">지출</div><div class="metric-value expense" id="total-expense">₩0</div></div>
        <div class="metric"><div class="metric-label">잔액</div><div class="metric-value" id="total-balance">₩0</div></div>
      </div>
      <div class="card" id="budget-alert-card" style="display:none">
        <div class="card-title">예산 현황</div>
        <div id="budget-alert-list"></div>
      </div>
      <div class="card">
        <div class="card-title">최근 거래</div>
        <div id="recent-list"></div>
      </div>
    </div>

    <!-- 기록 -->
    <div id="tab-add" class="section">
      <div class="card">
        <div class="type-toggle">
          <button class="type-btn active expense" id="btn-expense" onclick="setType('expense')">지출</button>
          <button class="type-btn income" id="btn-income" onclick="setType('income')">수입</button>
        </div>
        <div class="form-group">
          <label>금액</label>
          <input type="number" id="inp-amount" placeholder="0" inputmode="numeric">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>날짜</label>
            <input type="date" id="inp-date">
          </div>
          <div class="form-group">
            <label>카테고리</label>
            <select id="inp-category"></select>
          </div>
        </div>
        <div class="form-group">
          <label>메모 (선택)</label>
          <input type="text" id="inp-desc" placeholder="메모를 입력하세요">
        </div>
        <button class="submit-btn" onclick="addTransaction()">추가하기</button>
      </div>
    </div>

    <!-- 내역 -->
    <div id="tab-list" class="section">
      <div class="filter-row">
        <select id="filter-type" onchange="renderList()">
          <option value="all">전체</option>
          <option value="expense">지출</option>
          <option value="income">수입</option>
        </select>
        <select id="filter-cat" onchange="renderList()"></select>
      </div>
      <div class="card"><div id="tx-list"></div></div>
    </div>

    <!-- 통계 -->
    <div id="tab-stats" class="section">
      <div class="card">
        <div class="card-title">6개월 추이</div>
        <div class="chart-bars" id="chart-bars"></div>
        <div class="legend">
          <span><span class="legend-dot" style="background:#1D9E75"></span>수입</span>
          <span><span class="legend-dot" style="background:#e74c3c"></span>지출</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">카테고리별 지출</div>
        <div class="cat-stats" id="cat-stats"></div>
      </div>
    </div>

    <!-- 예산 -->
    <div id="tab-budget" class="section">
      <div class="card">
        <div class="card-title">월 예산 설정</div>
        <div id="budget-edit-list"></div>
        <button class="save-btn" onclick="saveBudgets()">저장하기</button>
      </div>
      <div class="card">
        <div class="card-title">이번 달 현황</div>
        <div id="budget-progress-list"></div>
      </div>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('home')" id="nav-home">
      <span class="nav-icon">🏠</span>홈
    </button>
    <button class="nav-item" onclick="switchTab('add')" id="nav-add">
      <span class="nav-icon">➕</span>기록
    </button>
    <button class="nav-item" onclick="switchTab('list')" id="nav-list">
      <span class="nav-icon">📋</span>내역
    </button>
    <button class="nav-item" onclick="switchTab('stats')" id="nav-stats">
      <span class="nav-icon">📊</span>통계
    </button>
    <button class="nav-item" onclick="switchTab('budget')" id="nav-budget">
      <span class="nav-icon">💰</span>예산
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS_EXPENSE = [
  {name:'식비',icon:'🍽️'},{name:'교통',icon:'🚌'},{name:'쇼핑',icon:'🛍️'},
  {name:'문화/여가',icon:'🎬'},{name:'의료',icon:'💊'},{name:'통신',icon:'📱'},
  {name:'주거',icon:'🏠'},{name:'기타지출',icon:'💸'}
];
const CATS_INCOME = [
  {name:'급여',icon:'💼'},{name:'부업',icon:'💡'},{name:'용돈',icon:'🎁'},{name:'기타수입',icon:'💰'}
];

let txType = 'expense';
let viewYear, viewMonth;
let transactions = [];
let budgets = {};

function getStorage(key) {
  try { return localStorage.getItem(key); } catch(e) { return null; }
}
function setStorage(key, val) {
  try { localStorage.setItem(key, val); } catch(e) {}
}

function loadData() {
  try { transactions = JSON.parse(getStorage('hb_tx') || '[]'); } catch(e) { transactions = []; }
  try { budgets = JSON.parse(getStorage('hb_budgets') || '{}'); } catch(e) { budgets = {}; }
}
function saveTransactions() { setStorage('hb_tx', JSON.stringify(transactions)); }
function saveBudgetData() { setStorage('hb_budgets', JSON.stringify(budgets)); }

function fmt(n) { return '₩' + Math.round(n).toLocaleString('ko-KR'); }
function monthKey(y, m) { return y + '-' + String(m + 1).padStart(2, '0'); }
function monthLabel(y, m) { return y + '년 ' + (m + 1) + '월'; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function changeMonth(d) {
  viewMonth += d;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderAll();
}

function switchTab(t) {
  ['home','add','list','stats','budget'].forEach(id => {
    document.getElementById('tab-' + id).classList.toggle('active', id === t);
    document.getElementById('nav-' + id).classList.toggle('active', id === t);
  });
  if (t === 'add') initAddForm();
}

function setType(t) {
  txType = t;
  document.getElementById('btn-expense').classList.toggle('active', t === 'expense');
  document.getElementById('btn-expense').classList.toggle('expense', t === 'expense');
  document.getElementById('btn-income').classList.toggle('active', t === 'income');
  document.getElementById('btn-income').classList.toggle('income', t === 'income');
  populateCatSelect('inp-category', t);
}

function getCatIcon(name) {
  const all = [...CATS_EXPENSE, ...CATS_INCOME];
  return (all.find(c => c.name === name) || {icon: '💳'}).icon;
}

function getCatBg(name) {
  const colors = {
    '식비':'#fff3e0','교통':'#e3f2fd','쇼핑':'#fce4ec','문화/여가':'#ede7f6',
    '의료':'#fce4ec','통신':'#e8f5e9','주거':'#f3e5f5','기타지출':'#f5f5f5',
    '급여':'#e8f5e9','부업':'#e3f2fd','용돈':'#ede7f6','기타수입':'#f5f5f5'
  };
  return colors[name] || '#f5f5f5';
}

function populateCatSelect(id, type) {
  const cats = type === 'income' ? CATS_INCOME : CATS_EXPENSE;
  document.getElementById(id).innerHTML = cats.map(c => `<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');
}

function initAddForm() {
  const d = new Date();
  document.getElementById('inp-date').value = d.toISOString().slice(0, 10);
  populateCatSelect('inp-category', txType);
}

function addTransaction() {
  const amt = parseFloat(document.getElementById('inp-amount').value);
  const date = document.getElementById('inp-date').value;
  const cat = document.getElementById('inp-category').value;
  const desc = document.getElementById('inp-desc').value.trim();
  if (!amt || amt <= 0 || !date) { showToast('금액과 날짜를 입력해주세요'); return; }
  transactions.push({ id: Date.now(), type: txType, amount: amt, date, category: cat, desc });
  transactions.sort((a, b) => b.date.localeCompare(a.date));
  saveTransactions();
  document.getElementById('inp-amount').value = '';
  document.getElementById('inp-desc').value = '';
  showToast('추가되었습니다 ✓');
  renderAll();
  switchTab('home');
}

function deleteTransaction(id) {
  if (!confirm('삭제할까요?')) return;
  transactions = transactions.filter(t => t.id !== id);
  saveTransactions();
  renderAll();
  showToast('삭제되었습니다');
}

function getMonthTx(y, m) {
  return transactions.filter(t => t.date.startsWith(monthKey(y, m)));
}

function renderAll() {
  document.getElementById('month-label').textContent = monthLabel(viewYear, viewMonth);
  renderHome(); renderList(); renderStats(); renderBudget();
}

function renderHome() {
  const txs = getMonthTx(viewYear, viewMonth);
  const income = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const bal = income - expense;
  document.getElementById('total-income').textContent = fmt(income);
  document.getElementById('total-expense').textContent = fmt(expense);
  const balEl = document.getElementById('total-balance');
  balEl.textContent = fmt(bal);
  balEl.style.color = bal >= 0 ? '#0F6E56' : '#c0392b';

  const recent = txs.slice(0, 6);
  const rl = document.getElementById('recent-list');
  if (!recent.length) {
    rl.innerHTML = '<div class="empty"><span class="empty-icon">📭</span>이번 달 거래가 없어요</div>';
  } else {
    rl.innerHTML = recent.map(t => `
      <div class="tx-item">
        <div class="tx-cat-icon" style="background:${getCatBg(t.category)}">${getCatIcon(t.category)}</div>
        <div class="tx-info">
          <div class="tx-desc">${t.desc || t.category}</div>
          <div class="tx-meta">${t.date} · ${t.category}</div>
        </div>
        <span class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</span>
      </div>`).join('');
  }

  const catExp = {};
  txs.filter(t => t.type === 'expense').forEach(t => { catExp[t.category] = (catExp[t.category] || 0) + t.amount; });
  const hasB = CATS_EXPENSE.some(c => budgets[c.name] > 0);
  const bc = document.getElementById('budget-alert-card');
  if (!hasB) { bc.style.display = 'none'; return; }
  bc.style.display = '';
  document.getElementById('budget-alert-list').innerHTML = CATS_EXPENSE.filter(c => budgets[c.name] > 0).map(c => {
    const spent = catExp[c.name] || 0;
    const limit = budgets[c.name];
    const pct = Math.min(100, Math.round(spent / limit * 100));
    const cls = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : 'ok';
    const badge = pct >= 100 ? '<span class="alert-badge over">초과</span>' : pct >= 80 ? '<span class="alert-badge warn">주의</span>' : '';
    return `<div class="budget-item">
      <div class="budget-top"><span class="budget-cat">${c.icon} ${c.name}${badge}</span><span class="budget-nums">${fmt(spent)} / ${fmt(limit)}</span></div>
      <div class="budget-bar-wrap"><div class="budget-bar ${cls}" style="width:${pct}%"></div></div>
      <div class="budget-pct" style="color:${pct>=100?'#c0392b':pct>=80?'#d68910':'#aaa'}">${pct}%</div>
    </div>`;
  }).join('');
}

function renderList() {
  const filterType = document.getElementById('filter-type')?.value || 'all';
  const catSel = document.getElementById('filter-cat');
  if (catSel) {
    const prev = catSel.value;
    catSel.innerHTML = '<option value="all">전체 카테고리</option>' +
      [...CATS_EXPENSE, ...CATS_INCOME].map(c => `<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');
    catSel.value = prev || 'all';
  }
  const filterCat = catSel?.value || 'all';
  let txs = getMonthTx(viewYear, viewMonth);
  if (filterType !== 'all') txs = txs.filter(t => t.type === filterType);
  if (filterCat !== 'all') txs = txs.filter(t => t.category === filterCat);
  const el = document.getElementById('tx-list');
  if (!txs.length) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">🔍</span>내역이 없어요</div>';
    return;
  }
  el.innerHTML = txs.map(t => `
    <div class="tx-item">
      <div class="tx-cat-icon" style="background:${getCatBg(t.category)}">${getCatIcon(t.category)}</div>
      <div class="tx-info">
        <div class="tx-desc">${t.desc || t.category}</div>
        <div class="tx-meta">${t.date} · ${t.category}</div>
      </div>
      <span class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</span>
      <button class="tx-del" onclick="deleteTransaction(${t.id})">×</button>
    </div>`).join('');
}

function renderStats() {
  const months = [];
  for (let i = 5; i >= 0; i--) {
    let y = viewYear, m = viewMonth - i;
    while (m < 0) { m += 12; y--; }
    months.push({ y, m });
  }
  const maxVal = Math.max(...months.map(({ y, m }) => {
    const txs = getMonthTx(y, m);
    return Math.max(
      txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0),
      txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0)
    );
  }), 1);
  document.getElementById('chart-bars').innerHTML = months.map(({ y, m }) => {
    const txs = getMonthTx(y, m);
    const inc = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const exp = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const ih = Math.max(2, Math.round(inc / maxVal * 90));
    const eh = Math.max(2, Math.round(exp / maxVal * 90));
    return `<div class="bar-col">
      <div class="bar-wrap">
        <div class="bar-income" style="height:${ih}px"></div>
        <div class="bar-expense" style="height:${eh}px"></div>
      </div>
      <span class="bar-label">${m + 1}월</span>
    </div>`;
  }).join('');

  const txs = getMonthTx(viewYear, viewMonth);
  const catExp = {};
  txs.filter(t => t.type === 'expense').forEach(t => { catExp[t.category] = (catExp[t.category] || 0) + t.amount; });
  const total = Object.values(catExp).reduce((s, v) => s + v, 0) || 1;
  const sorted = Object.entries(catExp).sort((a, b) => b[1] - a[1]);
  const el = document.getElementById('cat-stats');
  if (!sorted.length) { el.innerHTML = '<div class="empty"><span class="empty-icon">📊</span>이번 달 지출이 없어요</div>'; return; }
  el.innerHTML = sorted.map(([cat, amt]) => `
    <div class="cat-stat-item">
      <span class="cat-stat-icon">${getCatIcon(cat)}</span>
      <div class="cat-stat-info">
        <div class="cat-stat-name">${cat}</div>
        <div class="cat-stat-bar-wrap"><div class="cat-stat-bar" style="width:${Math.round(amt/total*100)}%"></div></div>
      </div>
      <div class="cat-stat-right">
        <div class="cat-stat-amt">${fmt(amt)}</div>
        <div class="cat-stat-pct">${Math.round(amt / total * 100)}%</div>
      </div>
    </div>`).join('');
}

function renderBudget() {
  const txs = getMonthTx(viewYear, viewMonth);
  const catExp = {};
  txs.filter(t => t.type === 'expense').forEach(t => { catExp[t.category] = (catExp[t.category] || 0) + t.amount; });
  document.getElementById('budget-edit-list').innerHTML = CATS_EXPENSE.map(c => `
    <div class="budget-edit-row">
      <label>${c.icon} ${c.name}</label>
      <input type="number" id="budget-${c.name}" value="${budgets[c.name] || ''}" placeholder="미설정" inputmode="numeric">
    </div>`).join('');
  const prog = document.getElementById('budget-progress-list');
  const hasB = CATS_EXPENSE.some(c => budgets[c.name] > 0);
  if (!hasB) { prog.innerHTML = '<div class="empty">예산을 설정해주세요</div>'; return; }
  prog.innerHTML = CATS_EXPENSE.filter(c => budgets[c.name] > 0).map(c => {
    const spent = catExp[c.name] || 0;
    const limit = budgets[c.name];
    const pct = Math.min(100, Math.round(spent / limit * 100));
    const cls = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : 'ok';
    return `<div class="budget-item">
      <div class="budget-top"><span class="budget-cat">${c.icon} ${c.name}</span><span class="budget-nums">${fmt(spent)} / ${fmt(limit)}</span></div>
      <div class="budget-bar-wrap"><div class="budget-bar ${cls}" style="width:${pct}%"></div></div>
      <div class="budget-pct" style="color:${pct>=100?'#c0392b':pct>=80?'#d68910':'#aaa'}">${pct}%</div>
    </div>`;
  }).join('');
}

function saveBudgets() {
  CATS_EXPENSE.forEach(c => {
    const v = parseFloat(document.getElementById('budget-' + c.name)?.value) || 0;
    if (v > 0) budgets[c.name] = v; else delete budgets[c.name];
  });
  saveBudgetData();
  renderAll();
  showToast('예산이 저장되었습니다 ✓');
}

function init() {
  const d = new Date();
  viewYear = d.getFullYear();
  viewMonth = d.getMonth();
  document.getElementById('today-label').textContent = d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
  loadData();
  initAddForm();
  renderAll();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

init();
</script>
</body>
</html>
